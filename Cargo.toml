[workspace]
# TODO: flatten members to root
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
lspelling-wordc = { path = "crates/wordc" }

ruspell = { git = "https://github.com/mrnossiom/ruspell.git" }
# ruspell = { path = "../ruspell" }

tracing = "0.1"

[patch.crates-io]
# upstream tower-lsp is unmaintained, using ongoing community fork
tower-lsp = { git = "https://github.com/tower-lsp/tower-lsp", branch = "main" }

[workspace.lints]
[workspace.lints.rust]
unsafe_code = "deny"
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# cargo = { level = "warn", priority = -1 }

dbg_macro = "warn"
# missing_docs_in_private_items = "warn"
# todo = "warn"
# unwrap_used = "warn"

redundant_pub_crate = "allow"
cast_possible_truncation = "allow"
[workspace.lints.rustdoc]
all = "warn"
